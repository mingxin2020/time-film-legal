<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>时间胶片隐私政策</title><style>body{max-width:680px;margin:0 auto;padding:48px 24px;font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#20262a;background:#f8f7f1}h1{font-weight:400}h2{font-size:20px;font-weight:500;margin-top:32px}small{color:#89929a}</style><h1>时间胶片隐私政策</h1><small>更新日期：2026年9月29日</small><h2>我们收集什么</h2><p>时间胶片不要求注册账号，也不收集姓名、邮箱、位置或联系人信息。计时记录、标签、事件、收藏和设置只保存在你的设备上。</p><h2>网络与第三方服务</h2><p>当前版本不向服务器上传个人数据，不使用广告、分析或社交服务。</p><h2>数据控制</h2><p>你可以在“我的”中导出记录或清空本地数据。删除 App 也会删除 App 沙盒中的本地数据。</p><h2>联系我们</h2><p>支持邮箱：请在上架前替换为你的真实邮箱。</p>
